    <rect x="286" y="210" width="130" height="92" rx="34" fill="#2b2b2b" stroke="#f2f2f2" stroke-width="10"/>
    <path d="M130 230v52M162 230v52M194 230v52" stroke="#0e0303" stroke-width="6" opacity=".5"/>
